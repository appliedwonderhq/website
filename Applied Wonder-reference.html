<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf9f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #__bundler_loading {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #666;
      background: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      z-index: 10000;
    }

    #__bundler_thumbnail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9f5;
      z-index: 9999;
    }

    #__bundler_thumbnail svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #__bundler_placeholder {
      color: #999;
      font-size: 14px;
    }
  </style>
  <noscript>
    <style>
      #__bundler_loading {
        display: none;
      }
    </style>
    <div
      style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>

<body>
  <div id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#3E57A4"></rect>
      <circle cx="50" cy="50" r="21" fill="none" stroke="#ffffff" stroke-width="7"></circle>
    </svg>
  </div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>

    document.addEventListener('DOMContentLoaded', async function () {
      const loading = document.getElementById('__bundler_loading');
      function setStatus(msg) { if (loading) loading.textContent = msg; }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error', function (e) {
        var p = document.body || document.documentElement;
        var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
        d.id = '__bundler_err';
        d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
          '[bundle] ' + (e.message || e.type) +
          (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
      }, true);

      try {
        const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
        const templateEl = document.querySelector('script[type="__bundler/template"]');
        if (!manifestEl || !templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
          return;
        }

        const manifest = JSON.parse(manifestEl.textContent);
        let template = JSON.parse(templateEl.textContent);

        const uuids = Object.keys(manifest);
        setStatus('Unpacking ' + uuids.length + ' assets...');

        const blobUrls = {};
        await Promise.all(uuids.map(async (uuid) => {
          const entry = manifest[uuid];
          try {
            const binaryStr = atob(entry.data);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            let finalBytes = bytes;
            if (entry.compressed) {
              if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                const reader = ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks = [];
                let totalLen = 0;
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  totalLen += value.length;
                }
                finalBytes = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
              } else {
                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
              }
            }

            blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
          }
        }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        setStatus('Rendering...');
        for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);
        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: fetch and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

  </script>

color:#1a1a1a;\">Newsletter<\u002Fa>\n          <a href=\"#faq\" style=\"color:#8a877e;width:fit-content;\" style-hover=\"color:#1a1a1a;\">FAQ<\u002Fa>\n        <\u002Fnav>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:22px;font:400 13px 'Inter',sans-serif;color:#8a877e;\">\n          <a href=\"https://x.com/appliedwonder\" style=\"color:#8a877e;width:fit-content;\" style-hover=\"color:#1a1a1a;\">X<\u002Fa>\n          <a href=\"mailto:hello@appliedwonder.com\" style=\"color:#8a877e;width:fit-content;\" style-hover=\"color:#1a1a1a;\">Email<\u002Fa>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <main style=\"flex:1;min-width:0;padding:92px 0 72px;max-width:560px;\">\n\n        <p style=\"font:400 16px/1.66 'Inter',sans-serif;letter-spacing:-0.012em;color:#33312e;margin:0;\">Applied Wonder is a lab in the original sense — a small group of curious people working on problems that annoy us personally. We use AI when it's free and useful, pay fairly when it isn't, and ignore it when it gets in the way.<br><br>Humans at the center. AI at the edge.<\u002Fp>\n\n        <section id=\"apps\" style=\"margin-top:88px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <h2 style=\"font:600 12.5px 'Inter',sans-serif;letter-spacing:0;color:#1a1a1a;margin:0;white-space:nowrap;\">Apps<\u002Fh2>\n            <div style=\"flex:1;height:1px;background:#e6e3db;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:26px;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px;margin:0 -14px;border-radius:11px;\" style-hover=\"background:#f4f3f0;\">\n              <div style=\"display:flex;align-items:center;gap:13px;min-width:0;\">\n                <img src=\"95f7d6b0-5dcb-49ff-89ff-4cc32a688e31\" alt=\"\" style=\"width:30px;height:30px;border-radius:7px;flex:none;\">\n                <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0;\">\n                  <span style=\"font:500 14px 'Inter',sans-serif;\">Mnemo<\u002Fspan>\n                  <span style=\"font:400 12.5px 'Inter',sans-serif;color:#9a968d;\">It remembers, so you don't have to.<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:15px;flex:none;color:#8a877e;\">\n                <a href=\"#\" title=\"macOS\" style=\"display:flex;\" style-hover=\"color:#1a1a1a;\"><svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"11.5\" rx=\"1.6\"><\u002Frect><line x1=\"9.5\" y1=\"20\" x2=\"14.5\" y2=\"20\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12\" y2=\"20\"><\u002Fline><\u002Fsvg><\u002Fa>\n                <a href=\"#\" title=\"iOS\" style=\"display:flex;\" style-hover=\"color:#1a1a1a;\"><svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><rect x=\"7\" y=\"2.5\" width=\"10\" height=\"19\" rx=\"2.6\"><\u002Frect><line x1=\"10.5\" y1=\"18.6\" x2=\"13.5\" y2=\"18.6\"><\u002Fline><\u002Fsvg><\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:1px;background:#f1f0ed;margin:0 -14px;\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px;margin:0 -14px;border-radius:11px;\">\n              <div style=\"display:flex;align-items:center;gap:13px;min-width:0;\">\n                <img src=\"d2ae2d7a-e2f2-4a31-a579-6be9766eb2d8\" alt=\"\" style=\"width:30px;height:30px;border-radius:7px;flex:none;\">\n                <span style=\"display:flex;flex-direction:column;gap:2px;min-width:0;\">\n                  <span style=\"font:500 14px 'Inter',sans-serif;color:#9a968d;\">That's right<\u002Fspan>\n                  <span style=\"font:400 12.5px 'Inter',sans-serif;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#c2beb5 0%,#c2beb5 44%,#8a877e 50%,#c2beb5 56%,#c2beb5 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:awshimmer 3.8s linear infinite;\">{{ hint }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#c2beb5;flex:none;\">Soon<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"news\" style=\"margin-top:88px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <h2 style=\"font:600 12.5px 'Inter',sans-serif;letter-spacing:0;color:#1a1a1a;margin:0;white-space:nowrap;\">Newsletter<\u002Fh2>\n            <div style=\"flex:1;height:1px;background:#e6e3db;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:24px;\">\n            <p style=\"font:400 14px/1.6 'Inter',sans-serif;color:#46433d;margin:0 0 18px;\">A quiet note when something new ships. Nothing else.<\u002Fp>\n            <form onsubmit=\"{{ onSub }}\" style=\"display:flex;align-items:center;gap:14px;border-bottom:1px solid #e2dfd7;max-width:350px;padding-bottom:9px;\">\n              <input type=\"email\" required=\"\" placeholder=\"you@email.com\" style=\"flex:1;border:none;background:transparent;color:#1a1a1a;font:400 14px 'Inter',sans-serif;outline:none;padding:0;\">\n              <button type=\"submit\" style=\"border:none;background:transparent;cursor:pointer;font:500 9.5px 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#E0821E;white-space:nowrap;\">Notify me →<\u002Fbutton>\n            <\u002Fform>\n            <sc-if value=\"{{ subbed }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font:500 10.5px 'IBM Plex Mono',monospace;color:#0E6C50;margin-top:12px;\">✓ You're on the list.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"faq\" style=\"margin-top:88px;\">\n          <div style=\"display:flex;align-items:center;gap:16px;\">\n            <h2 style=\"font:600 12.5px 'Inter',sans-serif;letter-spacing:0;color:#1a1a1a;margin:0;white-space:nowrap;\">FAQ<\u002Fh2>\n            <div style=\"flex:1;height:1px;background:#e6e3db;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:12px;\">\n            <sc-for list=\"{{ faq }}\" as=\"item\" hint-placeholder-count=\"4\">\n              <details style=\"border-bottom:1px solid #f1f0ed;\">\n                <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 14px;margin:0 -14px;border-radius:11px;font:400 13.5px 'Inter',sans-serif;color:#46433d;\" style-hover=\"background:#f4f3f0;\">{{ item.q }}<span style=\"font:400 14px 'IBM Plex Mono',monospace;color:#cdc9c0;flex:none;\">+<\u002Fspan><\u002Fsummary>\n                <p style=\"font:400 13px/1.62 'Inter',sans-serif;color:#9a968d;margin:0;padding:2px 0 16px;max-width:470px;\">{{ item.a }}<\u002Fp>\n              <\u002Fdetails>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n      <\u002Fmain>\n    <\u002Fdiv>\n\n    <footer style=\"border-top:1px solid #e6e3db;margin-top:40px;padding:56px 0 72px;\">\n      <img src=\"2dd72b75-2451-4c16-8ced-182a2a8af9e0\" alt=\"Applied Wonder\" style=\"width:100%;max-width:620px;height:auto;display:block;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:32px;font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.02em;color:#b3afa6;\">\n        <span>© 2026 Applied Wonder<\u002Fspan>\n        <span>Human at the center. AI at the edge.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { hint: 0, subbed: false };\n  componentDidMount() {\n    this._t = setInterval(() => this.setState(s => ({ hint: (s.hint + 1) % this._hints.length })), 3800);\n  }\n  componentWillUnmount() { clearInterval(this._t); }\n  get _hints() {\n    return [\n      \"Next up: the thing you do every morning, minus the friction.\",\n      \"It has something to do with your inbox — and a lot less of it.\",\n      \"We're counting the taps you'll never make again.\",\n      \"A small tool for an annoyance you've stopped noticing.\",\n    ];\n  }\n  renderVals() {\n    const faq = [\n      { q: \"Who's behind Applied Wonder?\", a: \"A small collective of developers, designers and product people. We build the tools we wished existed, then share the ones that turn out well.\" },\n      { q: \"Do your apps use AI?\", a: \"Sometimes. We reach for AI when it genuinely helps and is free or fairly priced — and leave it out entirely when it gets in the way.\" },\n      { q: \"What do the apps cost?\", a: \"It varies per app. We price fairly, never sell your data, and never bury a paywall in a dark pattern.\" },\n      { q: \"How do I hear about new apps?\", a: \"The newsletter above, or follow along on X. We only send something when there's genuinely something to send.\" },\n    ];\n    return {\n      hint: this._hints[this.state.hint],\n      faq,\n      subbed: this.state.subbed,\n      onSub: (e) => { e.preventDefault(); this.setState({ subbed: true }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
